name: E2E

# Browser tests (Playwright, Chromium) against the real embedded server.
# Pull requests only: no push, schedule or manual trigger, no secrets, no deploy.
on:
  pull_request:
    branches:
      - v2/native-agent-blueprint

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - run: make web-install
      - run: make e2e-install
      # playwright.config.ts starts the server itself: `make build` (SPA embedded in the Go
      # binary), then bin/sakuraops-server on 127.0.0.1:18181. CI=true forbids reusing a server.
      - run: make e2e
      # Reports hold traces and screenshots of the fictional spike page only.
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
          if-no-files-found: ignore
