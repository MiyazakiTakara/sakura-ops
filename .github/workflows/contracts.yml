name: Contracts

# Pull requests only: no push, schedule or manual trigger, no secrets, no deploy.
on:
  pull_request:
    branches:
      - v2/native-agent-blueprint

permissions:
  contents: read

concurrency:
  group: contracts-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Generated contracts, lint, breaking, contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Full history: buf breaking compares against the base branch (origin/v2/native-agent-blueprint).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - run: make web-install
      # Fail closed: the base ref must resolve and contain both contracts; no bootstrap skip in CI.
      - name: Verify base ref
        run: |
          git rev-parse --verify "origin/v2/native-agent-blueprint^{commit}"
          echo "PROTO_BASE=origin/v2/native-agent-blueprint = $(git rev-parse origin/v2/native-agent-blueprint)"
      - run: make contracts-check
        env:
          CONTRACT_BASE_REQUIRED: "1"
      - run: make contracts-test
      - run: make proto-breaking-test
      - run: make openapi-breaking-test
      - run: make contracts-real-history-test
