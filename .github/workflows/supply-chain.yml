name: Supply chain

# Pull requests only: no push, schedule or manual trigger, no secrets, no deploy.
on:
  pull_request:
    branches:
      - v2/native-agent-blueprint

permissions:
  contents: read

concurrency:
  group: supply-chain-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sbom-licenses-audit:
    name: SBOM, licence policy, vulnerability audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - run: make web-install
      # Pinned syft (SHA-256 verified by the script). Needs build first, which `sbom` runs.
      - run: make supply-chain
      - name: Upload SBOMs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-cyclonedx
          path: bin/sbom/*.cdx.json
          retention-days: 7
          if-no-files-found: error

  image-scan:
    name: Container image vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      # Builds every locally built Compose image (hub, migrator, derived postgres), pulls each pinned external
      # digest, downloads the grype vulnerability database (no cache: always current), scans each image directly
      # and via its syft SBOM, and applies the policy to the union.
      - run: make image-scan
      - name: Upload image reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-scan-reports
          path: |
            bin/image-scan/*.grype.json
            bin/image-scan/*.cdx.json
            bin/image-scan/*.syft.json
          retention-days: 7
          if-no-files-found: error
