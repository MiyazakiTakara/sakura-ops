version: v2
modules:
  - path: .
lint:
  use:
    - STANDARD
  except:
    # The spike uses a plain Ping/Pong pair for the stream and EchoRequest for
    # the unary call; the real protocol (NEXT-006) will follow the standard names.
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
    - RPC_REQUEST_RESPONSE_UNIQUE
