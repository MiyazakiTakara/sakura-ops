apiVersion: "sakuraops/v1"
kind: "Task"
metadata:
  id: "linux-config-deploy"
  version: 1
  name: "Wdróż zatwierdzoną konfigurację"
inputs:
  artifact_id:
    type: "string"
    label: "Zatwierdzony artefakt"
  config_id:
    type: "string"
    label: "Zatwierdzony cel konfiguracji"
steps:
  -
    id: "main"
    action: "linux.config.deploy"
    version: 1
    with:
      artifact_id:
        input: "artifact_id"
      config_id:
        input: "config_id"
