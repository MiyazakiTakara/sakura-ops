<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SakuraOps Console</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #151a20; color: #e5e7eb;
    font-family: system-ui, sans-serif;
  }
  main { max-width: 1100px; margin: auto; padding: 24px; }
  header { display:flex; justify-content:space-between; align-items:center; gap:12px; }
  h1 { color:#e8b4c8; font-size:24px; }
  a { color:#e8b4c8; }
  #terminal {
    background:#101820; border:1px solid #3a4652;
    border-radius:8px; padding:18px; min-height:450px;
    font:14px/1.6 monospace;
  }
  #output { white-space:pre-wrap; overflow-wrap:anywhere; }
  .command { color:#97e6ae; }
  .result { color:#d7e1e7; margin-bottom:10px; }
  form { display:flex; gap:10px; align-items:center; }
  label { color:#97e6ae; }
  input {
    flex:1; min-width:0; background:transparent; border:0;
    color:white; font:inherit; outline-offset:5px;
  }
  button {
    background:#ae7891; color:#101820; padding:8px 14px;
    border:0; border-radius:5px; cursor:pointer; font-weight:600;
  }
  button:focus-visible, a:focus-visible, input:focus-visible {
    outline:2px solid #f5c4d8;
  }
  footer { margin-top:12px; color:#aab7c2; font-size:13px; }
  @media (max-width:600px) {
    main { padding:12px; }
    header { flex-wrap:wrap; }
    #terminal { min-height:65vh; padding:12px; }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>🌸 SakuraOps</h1>
    <a href="/">Panel główny</a>
  </header>
  <section id="terminal" aria-label="Konsola administracyjna">
    <div id="output" aria-live="polite"></div>
    <form id="command-form">
      <label for="command">skr &gt;</label>
      <input id="command" autocomplete="off" spellcheck="false"
             aria-label="Polecenie SakuraOps" maxlength="500" autofocus>
      <button type="submit">Wykonaj</button>
    </form>
  </section>
  <footer>↑/↓ historia • Enter wykonaj • Ctrl+L wyczyść</footer>
</main>
<script>
const output = document.getElementById("output");
const input = document.getElementById("command");
const form = document.getElementById("command-form");
const history = [];
let historyIndex = 0;

function print(text, className = "result") {
  const line = document.createElement("div");
  line.className = className;
  line.textContent = text;
  output.appendChild(line);
  line.scrollIntoView({block:"nearest"});
}

print("SakuraOps 0.1.0-dev");
print("Wpisz help, aby wyświetlić polecenia.");

form.addEventListener("submit", async (event) => {
  event.preventDefault();
  const command = input.value.trim();
  if (!command) return;

  history.push(command);
  historyIndex = history.length;
  input.value = "";
  print("skr > " + command, "command");

  if (command === "clear" || command === "skr clear") {
    output.replaceChildren();
    return;
  }

  input.disabled = true;
  try {
    const response = await fetch("/api/console", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "X-CSRF-Token": window.SAKURAOPS_CSRF
      },
      body: JSON.stringify({command})
    });
    if (response.status === 401) {
      print("Sesja wygasła. Zaloguj się ponownie.");
      return;
    }
    const data = await response.json();
    print(response.ok ? data.output : (data.detail || "Błąd wykonania"));
  } catch (_) {
    print("Nie można połączyć się z serwerem SakuraOps.");
  } finally {
    input.disabled = false;
    input.focus();
  }
});

input.addEventListener("keydown", (event) => {
  if (event.key === "ArrowUp" && historyIndex > 0) {
    event.preventDefault();
    input.value = history[--historyIndex];
  } else if (event.key === "ArrowDown") {
    event.preventDefault();
    if (historyIndex < history.length) historyIndex++;
    input.value = history[historyIndex] || "";
  }
});

document.addEventListener("keydown", (event) => {
  if (event.ctrlKey && event.key.toLowerCase() === "l") {
    event.preventDefault();
    output.replaceChildren();
    input.focus();
  }
});
</script>
</body>
</html>
