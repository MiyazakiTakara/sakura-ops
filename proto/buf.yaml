version: v2
modules:
  - path: .
lint:
  use:
    - STANDARD
  except:
    # The service is one bidirectional stream of envelopes (docs/13-agent-protocol.md):
    # AgentMessage and HubMessage are the normative names, not ConnectRequest/Response.
    # The service name AgentHub is fixed by docs/13-agent-protocol.md.
    - SERVICE_SUFFIX
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
breaking:
  use:
    - FILE
